[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lagctl"
version = "0.3.0"
description = "A small macOS LaunchAgent manager"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["macos", "launchd", "launchagent", "tui", "process-manager"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
lagctl = "lagctl:main"

[project.optional-dependencies]
tui = ["textual>=0.70,<1.0"]

[tool.setuptools]
py-modules = ["lagctl"]

[tool.setuptools.packages.find]
include = ["lagctl_tui*"]
